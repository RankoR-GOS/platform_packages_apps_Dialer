name: Build application

on: [pull_request, push]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDKs
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle

      # Release too, so a break in the R8 and proguard configuration is caught here rather than
      # at release time.
      - name: Assemble debug and release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace --console=plain

  ktlint:
    name: ktlintCheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDKs
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle

      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck --no-daemon --stacktrace --console=plain

      - name: Upload ktlint reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ktlint-reports
          path: |
            build/reports/ktlint/
            app/build/reports/ktlint/
          if-no-files-found: ignore

  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDKs
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle

      - name: Run Detekt
        run: ./gradlew :app:detektDebug --no-daemon --stacktrace --console=plain

      - name: Upload Detekt reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: detekt-reports
          path: app/build/reports/detekt/
          if-no-files-found: ignore

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDKs
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle

      # lint-baseline.xml filters the inherited AOSP issues, so this fails only on new ones.
      - name: Run lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace --console=plain

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The app compiles against a Java 17 toolchain, but Robolectric needs a Java 21 launcher.
      - name: Set up JDKs
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle

      # Thresholds are a floor set at the level the suite actually reaches, not an aspiration.
      # Raising one later is easy; a threshold that fails on day one just gets switched off.
      - name: Run unit tests and coverage gate
        run: >
          ./gradlew :app:jacocoUnitTestVerification
          -PunitTestMinCoverage=70
          -PunitTestMinBranchCoverage=60
          --no-daemon --stacktrace --console=plain

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/jacoco/jacocoUnitTestReport/
          if-no-files-found: ignore

  instrumented-tests:
    name: Instrumented tests (Android 37 x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDKs
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore AVD cache
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-37.0-x86_64-google_apis

      # minSdk is 37, so nothing below that can install the app. Google publishes no plain
      # "android-37" package and no "default" image at this level: the SDK paths are
      # platforms;android-37.0 and system-images;android-37.0;google_apis;x86_64, and the action
      # concatenates api-level straight into both.
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 37.0
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 37.0
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >
            ./gradlew :app:connectedDebugAndroidTest :app:jacocoAndroidTestVerification
            -PandroidTestMinCoverage=80
            -PandroidTestMinBranchCoverage=50
            --no-daemon --stacktrace --console=plain

      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/jacoco/jacocoAndroidTestReport/
          if-no-files-found: ignore
